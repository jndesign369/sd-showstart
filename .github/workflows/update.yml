name: Update shows

on:
  push:
    branches: [main]
  schedule:
    # 7:30am/pm PST; 8:30am/pm PDT. GitHub may delay scheduled runs.
    - cron: "30 3,15 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Collect fresh ConcertsSD listings before deploying"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Collect ConcertsSD listings
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python collect.py
      - name: Link artist homepages
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python enrich.py --max-requests 400
      - name: Choose cached Bandcamp songs or Spotify artist links
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python listen.py
      - name: Save refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows.json data/artist_cache.json data/listen_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ConcertsSD listings"
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: |
          python -c "import json; d=json.load(open('shows.json')); assert d.get('shows'), 'No listings to publish'"
          mkdir -p site
          cp index.html shows.json VERSION site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
