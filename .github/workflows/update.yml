name: Update shows

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Scrape venues before deploying. Leave unchecked for first setup."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: read
    outputs:
      refresh_failed: ${{ steps.refresh.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Install scraper browser
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -m playwright install --with-deps chromium

      - name: Refresh venue listings
        id: refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        run: python -u run.py

      - name: Save updated data
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name "show-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows.json data/
          if ! git diff --cached --quiet; then
            git commit -m "Update shows $(date -u +%F)"
            git push origin HEAD:main
          fi

      - name: Validate and prepare website
        run: python scripts/prepare_site.py

      - name: Warn if collection failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Refresh failed. Deploying the existing snapshot."
          echo "Refresh failed. Existing snapshot retained." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  refresh-status:
    needs: [prepare, deploy]
    if: needs.prepare.outputs.refresh_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report collection failure
        run: |
          echo "::error::Collection failed. The existing snapshot was deployed."
          exit 1
